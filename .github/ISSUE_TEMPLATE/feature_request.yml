name: Feature request
description: Suggest an addition or a change to the package.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the IndexNow protocol handling itself belong in the core package,
        [slimad/indexnow](https://github.com/maciej-kosiedowski/IndexNow). This repository
        only holds the Laravel glue: configuration, container bindings, stores, the queued
        job, Artisan commands and the Eloquent trait.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Can this be solved today with a custom UrlStore, an event listener or a custom IndexNowClient binding?
    validations:
      required: false
